<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forms</title>
</head>
<body>
    <from action="/action">
        <div>
            <label for="simple"> Simple input type: </label>
            <input id="simple" placeholder="simple input type" name="simple"/>
       </div>
       
       <div>
            <label for="text"> text input type: </label>
            <input type="text"  placeholder="text input type" id="text"/>
       </div>

       <div>
            <label for="password"> password input type: </label>
            <input type="password" placeholder="password input type" id="password"/>
       </div>
       
       
       <div>
            <label for="number"> numper input type: </label>
            <input type ="number" id="number"/>
       </div>
       
       <div>
            <lable for="time"> time input type:   </lable>
            <input type="time" id="time">
        </div>  
        
        <div> 
            <lable for="color"> color input type: </lable>
            <input type="color" id="color">
        </div>

        <div>
            <input type="checkbox" id="age" name="age" checked />
            <lable for="age"> I am 18+</lable>
        </div>

        <div>
            we can group radio button by keeping same name for all buttons <br>
            <input type="radio" id="apple" name="fruit" value="apple"/>
            <lable for="apple">Apple</lable>

            <input type="radio" id="banana" name="fruit" value="banana"/>
            <lable for="banana">Banana</lable>

            <input type="radio" id="Orange" name="fruit" value="Orange"/>
            <lable for="Orange">Orange</lable>

            <input type="radio" id="Mango" name="fruit"/>
            <lable for="Mango">Mango</lable>
        </div>
        <div>
            select your profession
            <select name="profession" id="profession">
                <option value="student">Student</option>
                <option value="developer">Developer</option>

            </select>
        </div>
        <div>
            <label for="volume">Select your volume level: </label>
            <input type="range" id="volume" min="0" max="100" name="volume" step="10">
        </div>
        <button>Submit</button>
        
    </from>
    <hr/>
    <form action="https://www.youtube.com/results">
        <input type="text" placeholder="search in youtube" name="search_query">
        <button>search</button>

    </form>

    <hr>
    <form action ="https://www.google.com/search">
        <input type="text" placeholder="search in google" name="q">
        <button>search on google</button>

    </form>
    
</body>
</html>
