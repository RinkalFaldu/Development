<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forms</title>
</head>
<body>
    <from action="/action">
        <div>
            <label for="simple"> Simple input type: </label>
            <input id="simple" placeholder="simple input type" name="simple"/>
       </div>
       
       <div>
            <label for="text"> text input type: </label>
            <input type="text"  placeholder="text input type" id="text"/>
       </div>

       <div>
            <label for="password"> password input type: </label>
            <input type="password" placeholder="password input type" id="password"/>
       </div>
       
       
       <div>
            <label for="number"> numper input type: </label>
            <input type ="number" id="number"/>
       </div>
       
       <div>
            <lable for="time"> time input type:   </lable>
            <input type="time" id="time">
        </div>  
        
        <div> 
            <lable for="color"> color input type: </lable>
            <input type="color" id="color">
        </div>
        
        <button>Submit</button>
        
    </from>
    <hr/>
    <form action="https://www.youtube.com/results">
        <input type="text" placeholder="search in youtube" name="search_query">
        <button>search</button>

    </form>

    <hr>
    <form action ="https://www.google.com/search">
        <input type="text" placeholder="search in google" name="q">
        <button>search on google</button>

    </form>
    
</body>
</html>
